<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corporate Website</title>
<meta name="description" content="Sample corporate site">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
<div class="logo">COMPANY</div>
<button class="hamburger">☰</button>
<nav>
<a href="#about">ABOUT</a>
<a href="#service">SERVICE</a>
<a href="#works">WORKS</a>
<a href="#contact">CONTACT</a>
</nav>
</header>
<section class="hero">
<div class="hero__content">
<h1>Create the Future.</h1>
<p>Craftsmanship × Innovation</p>
</div>
</section>
<section id="about"><h2>ABOUT</h2><p>会社紹介...</p></section>
<section id="service"><h2>SERVICE</h2><div class="cards">
<article><h3>Tile</h3></article>
<article><h3>Stone</h3></article>
<article><h3>Exterior</h3></article>
</div></section>
<section id="works"><h2>WORKS</h2><div class="gallery">
<div class="item">Project 1</div><div class="item">Project 2</div><div class="item">Project 3</div>
</div></section>
<section id="contact">
<h2>CONTACT</h2>
<form>
<input placeholder="お名前">
<input type="email" placeholder="メール">
<textarea placeholder="お問い合わせ"></textarea>
<button>送信</button>
</form>
</section>
<footer>© COMPANY</footer>
<script src="js/script.js"></script>
</body>
</html>
